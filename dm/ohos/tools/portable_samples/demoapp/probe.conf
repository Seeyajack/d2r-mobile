# 样本项目自己的探针配置。
# The sample project's own probe configuration.
#
# 这一份本身就是被测对象之一：**探针能不能读懂"另一个项目"的配置**。
# This file is itself under test: can the probes read a configuration that belongs to another project?
#
# 两个根要分清：
#   · DM_HOST_DIR / DM_INCLUDE_DIRS  → 相对**本项目**（demoapp/）
#   · DM_SHIM_DIR / DM_COMPAT_SRC_DIR → 相对 **L1 根**（d2r-mobile 仓库），因为垫片层住在那里
# Two roots: the first two are relative to this project, the last two to the L1 root (the d2r-mobile
# repo), because that is where the shim layer lives.

DM_HOST_DIR="src"
DM_INCLUDE_DIRS="include"
DM_SHIM_DIR="dm/ohos/compat"
DM_COMPAT_SRC_DIR="dm/ohos/compat/src"

# **这个样本故意换了一种目录布局**（src/platform、src/fs、src/crypto…嵌套三层），
# 所以必须打开递归——这正是拿它来打"工具只扫一层"那个隐含假设的地方。
DM_RECURSE=1

# 本项目不排除任何文件：src/ 下的每一个都应该编过。
DM_EXCLUDE=""

# 只链 libc 就够了（这个样本不用鸿蒙的 NAPI / hilog / Vulkan）。
DM_LINK_LIBS="-lz"

DM_DEFINES="-D__OHOS__=1 -D_GNU_SOURCE=1"
DM_FORCE_INCLUDE="shim_prefix.h"
