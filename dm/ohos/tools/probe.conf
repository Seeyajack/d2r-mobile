# 探针配置 —— 所有"属于某个具体项目"的清单都在这里，脚本本身不含项目专有内容。
# Probe configuration -- every project-specific list lives here; the scripts contain none.
#
# 为什么要把这些挪出来：原来"哪些文件排除、要链哪些库"是写死在脚本里的，
# 于是那两个脚本只能服务于这一个项目。挪到这里之后，**换一个程序/项目只改这个文件**，
# 脚本一个字不用动——这才是"通用工具"与"一次性脚本"的区别。
# Why: the exclusion lists and libraries used to be hardcoded in the scripts, which made those scripts
# single-project tools. With them here, adapting to another program or project means editing only this
# file -- the difference between a reusable tool and a throwaway script.
#
# 用法：脚本会自动 source 本文件；任何一项都可以用同名环境变量临时覆盖。
# Usage: the scripts source this file; any value can be overridden by an environment variable of the
# same name.

# ---------------------------------------------------------------- 路径
# 宿主源码目录（相对仓库根）
DM_HOST_DIR="dm/host"

# 编译时的 include 路径（相对仓库根，冒号分隔）。**顺序即优先级**：
# 垫片目录必须排在 sysroot 之前，否则 `#include <TargetConditionals.h>` 之类会先去找系统目录。
DM_INCLUDE_DIRS="dm/ohos/compat:dm/ohos:dm/host:dm/gfx"

# ---------------------------------------------------------------- 排除名单
# 不参与探针的文件（空格分隔，按文件名匹配）。判据只有两条：
#   ① 需要"从使用者自己的程序文件生成的数据表"才能编；
#   ② 是别的平台的前端（鸿蒙侧有 front_ohos.c 顶替）。
# 这两类**都不是移植问题**，排除掉，否则报告里的数字会被噪声污染。
# 接一个新程序时：把它的"专属文件"加进来即可。
DM_EXCLUDE="diag.c dm_bright.c dm_vault_ui.c touch_mac.c"

# ---------------------------------------------------------------- 参与链接探针的源
# 鸿蒙侧自己的源（相对仓库根）
DM_OHOS_SRCS="dm/ohos/front_ohos.c dm/ohos/dm_log.c dm/ohos/audio_ohos.c dm/ohos/map_image_ohos.c"
# 垫片层目录（整个目录都会编进来）
DM_COMPAT_SRC_DIR="dm/ohos/compat/src"

# 上游别处、但属于"通用/领域层"的源（相对仓库根）
# 例：触摸控制模块虽然在 ios/ 下，但只包含自己的头 + host/dm_input.h + 标准库，
#     实测在鸿蒙侧原样编过 ⇒ 直接编，不用移植。
DM_EXTRA_SRCS="dm/ios/Sources/dm_touch_controls.c"

# 第三方源（相对仓库根）。清单照抄上游 dm/host/Makefile 的 LIBDEFLATE 变量（只编解压相关部分）。
DM_THIRD_PARTY_SRCS="
dm/third_party/libdeflate/lib/deflate_decompress.c
dm/third_party/libdeflate/lib/zlib_decompress.c
dm/third_party/libdeflate/lib/adler32.c
dm/third_party/libdeflate/lib/utils.c
dm/third_party/libdeflate/lib/arm/cpu_features.c
"

# ---------------------------------------------------------------- 链接
# 要链的系统库（空格分隔）。sysroot 里都有；接新项目时按需增减。
DM_LINK_LIBS="-lz -lace_napi.z -lace_ndk.z -lhilog_ndk.z -lnative_window -lohaudio"

# ---------------------------------------------------------------- 编译开关
DM_DEFINES="-D__OHOS__=1 -DDM_LOG_TO_HILOG=1 -D_GNU_SOURCE=1"
# 强制包含的头（靠 -I 找得到）。留空表示不加。
DM_FORCE_INCLUDE="shim_prefix.h"
